<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>PRIMAL: SURVIVAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2a3a;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);width:170px;pointer-events:none}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:15px}
.bar b{flex:1;height:12px;background:#0008;border-radius:6px;overflow:hidden;border:1px solid #fff3}
.bar u{display:block;height:100%;width:100%;border-radius:6px;text-decoration:none}
#bh{background:#e04848}#bu{background:#d8923a}#bt{background:#3a9ae0}
.low b{animation:bl .6s infinite alternate}@keyframes bl{to{border-color:#f55}}
#tl{font-size:12px;background:#0008;border-radius:8px;padding:4px 8px;margin-top:6px;display:inline-block}
#clock{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);background:#0008;border-radius:10px;padding:6px 10px;font-size:13px;pointer-events:none}
#hot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:6px;background:#0007;padding:6px;border-radius:14px}
.s{position:relative;width:46px;height:46px;border-radius:10px;background:#1c2b38;border:2px solid #456;display:flex;align-items:center;justify-content:center;font-size:24px}
.s.on{border-color:#ffd24a;background:#3a3420}.s.lock{opacity:.35}
.s em{position:absolute;left:3px;top:0;font-size:10px;font-style:normal;opacity:.7}
.s .mt{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;border:1px solid #000a;pointer-events:none}
.s .du{position:absolute;left:4px;right:4px;bottom:3px;height:4px;background:#000b;border-radius:2px;overflow:hidden;pointer-events:none;text-decoration:none}
.s .du i{display:block;height:100%}
.s small{position:absolute;right:3px;bottom:0;font-size:12px;font-weight:700}
#btns{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#btns button{border:2px solid #fff5;background:#14202bcc;color:#fff;border-radius:50%;width:52px;height:52px;font-size:24px;touch-action:none}
#btns #bE{width:74px;height:74px;font-size:30px;background:#2c7a3ecc}
#joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:#fff2;border:2px solid #fff5;display:none;pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#fffa}
.panel{position:fixed;inset:0;margin:auto;width:min(92vw,460px);height:fit-content;max-height:80vh;overflow:auto;background:#14202bf2;border:2px solid #3b5a73;border-radius:16px;padding:14px;display:none;z-index:5}
.panel h2{margin:0 0 10px;font-size:18px}.x{position:absolute;right:10px;top:8px;background:none;border:0;color:#fff;font-size:22px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c{background:#1c2b38;border-radius:10px;padding:8px 2px;text-align:center;font-size:11px;position:relative}
.c i{display:block;font-style:normal;font-size:28px}.c b{position:absolute;right:6px;top:4px;font-size:13px}.c.z{opacity:.35}
.r{display:flex;align-items:center;gap:10px;background:#1c2b38;border-radius:10px;padding:8px;margin-bottom:8px}
.r>i{font-style:normal;font-size:30px}.r div{flex:1;font-size:12px}.r strong{font-size:14px}
.r button{background:#2c7a3e;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:13px}.r button:disabled{background:#444;opacity:.6}
.no{color:#f77}.ok{color:#8f8}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#000b;padding:8px 14px;border-radius:10px;font-size:14px;display:none;z-index:6;text-align:center}
#hot .s{width:40px;height:40px;font-size:21px}
#hot{gap:4px;padding:5px}
#btns{gap:8px}#btns button{width:46px;height:46px;font-size:21px}#btns #bE{width:70px;height:70px}
.panel{bottom:62px;width:min(96vw,520px);max-height:calc(100vh - 150px);touch-action:pan-y}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.g .s{width:100%;height:auto;aspect-ratio:1;font-size:clamp(16px,5vw,24px)}
.s.sl{outline:3px solid #6cf}
#gh{position:fixed;pointer-events:none;transform:translate(-50%,-50%);font-size:32px;z-index:20}
.ib{margin-top:10px;font-size:13px;min-height:34px}
.ib button{margin:4px 4px 0 0;background:#2c5a7a;color:#fff;border:0;border-radius:8px;padding:7px 9px;font-size:12px}

/* --- печь --- */
#ov{background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;border-radius:4px;color:#3a3a3a}
#ov .x{color:#333}#ov h2{color:#3a3a3a}
#ov .s{background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;border-radius:0}
#ov .s.sl{outline:3px solid #2a7fff}#ov .s small{color:#fff;text-shadow:1px 1px #000}
#ov .s .gh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.25;filter:grayscale(1);font-weight:400}
.ow{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 8px}
.ol{display:flex;flex-direction:column;gap:20px}.orow{display:flex;align-items:center;gap:6px}
#ov .ow .s{width:54px;height:54px;font-size:28px}
.of{position:relative;width:20px;height:54px;background:#373737;border:2px solid;border-color:#222 #fff #fff #222;overflow:hidden}
.of i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ffd24a,#e8651a)}
.of b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;opacity:.35;filter:grayscale(1)}
.of.on b{opacity:1;filter:none;animation:flk .35s infinite alternate}
@keyframes flk{from{transform:scale(.85) rotate(-7deg)}to{transform:scale(1.25) rotate(7deg)}}
.op{width:62px;height:20px;background:#373737;border:2px solid;border-color:#222 #fff #fff #222}
.op i{display:block;height:100%;width:0;background:#e8651a}
.oh{font-size:13px;font-weight:700;text-align:center;min-height:20px;margin-bottom:6px}
[hidden]{display:none!important}
/* ================= ГЛАВНОЕ МЕНЮ, РЕЖИМЫ, СМЕРТЬ ================= */
:root{--ff:'Philosopher','Cormorant Garamond',Georgia,'Times New Roman',serif;--ft:'Forum','Trajan Pro',Georgia,'Times New Roman',serif}
.mb{position:relative;display:block;width:min(86vw,340px);padding:15px 22px;margin:0 auto 12px;font:700 clamp(14px,3.6vw,18px)/1.1 var(--ff);letter-spacing:.26em;text-indent:.26em;text-transform:uppercase;color:#f0e2c2;background:linear-gradient(#2c2319d9,#17110cea);border:1px solid #8a6a3a99;border-radius:3px;cursor:pointer;overflow:hidden;transition:transform .2s,box-shadow .25s,border-color .25s,color .25s;box-shadow:inset 0 1px 0 #ffffff14,0 6px 22px #000a;text-align:center}
.mb::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffd9a044 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.mb:hover{border-color:#ffb85c;color:#fff;box-shadow:0 0 26px #ff8a2a66,inset 0 1px 0 #ffffff22,0 6px 22px #000a;transform:translateY(-1px)}
.mb:hover::before{transform:translateX(120%)}
.mb:active{transform:scale(.98)}
.mb.pri{background:linear-gradient(#dd7a2c,#8d3a12);border-color:#ffc882;color:#fff7e4;text-shadow:0 1px 2px #5a220a}
.mb.dng{background:linear-gradient(#a8261c,#5e0f0a);border-color:#ff8a7a;color:#ffeae6}
.mb.sm{font-size:14px;padding:12px 18px;width:min(80vw,300px)}
.mb small{display:block;margin-top:7px;font:400 12px/1.2 var(--ff);letter-spacing:.08em;text-indent:0;text-transform:none;opacity:.85}
#menu{position:fixed;inset:0;z-index:50;background:#04080a;overflow:hidden;font-family:var(--ff);color:#e9dcc0;touch-action:pan-y;transition:opacity .8s}
#menu.off{opacity:0;pointer-events:none}
#mbg{position:absolute;inset:0;width:100%;height:100%;display:block}
#menu .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 58%,transparent 38%,#000b 100%),linear-gradient(#0009,transparent 28%,transparent 62%,#000a)}
.mscr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transform:translateY(16px) scale(.985);transition:opacity .5s,transform .5s,visibility 0s .5s}
.mscr.on{opacity:1;visibility:visible;transform:none;transition:opacity .55s,transform .55s}
.mi{margin:auto;display:flex;flex-direction:column;align-items:center;width:100%}
.logo{text-align:center;line-height:1;margin-bottom:clamp(18px,5vh,44px)}
.logo h1{margin:0;font:400 clamp(40px,11.5vw,118px)/1 var(--ft);letter-spacing:.07em;padding-left:.07em;background:linear-gradient(180deg,#fff2cd 0%,#f4b85e 36%,#cb682b 68%,#7d3314 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #2a0e04) drop-shadow(0 0 24px #ff8a2a55);animation:logoIn 1.8s cubic-bezier(.2,.7,.2,1) both,flick 5s 1.8s infinite}
.logo h2{margin:.5em 0 0;font:400 clamp(14px,3.5vw,31px)/1 var(--ft);letter-spacing:.62em;padding-left:.62em;color:#dccda8;text-shadow:0 2px 10px #000;display:flex;align-items:center;justify-content:center;gap:.9em;animation:fadeUp 1.4s .5s both}
.logo h2::before,.logo h2::after{content:"";height:1px;width:clamp(28px,9vw,120px);background:linear-gradient(90deg,transparent,#d8a24e)}
.logo h2::after{transform:scaleX(-1)}
.mscr.on .mb,.mscr.on .card,.mscr.on .msave{animation:fadeUp .7s calc(var(--d,0s) + .15s) both}
.msv{width:min(86vw,340px);margin-top:6px}
.msv .cap{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#b9a47c;text-align:center;margin-bottom:8px}
.msave{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;margin-bottom:8px;background:#120d0acc;border:1px solid #5b4528aa;border-left:3px solid #e0903a;border-radius:3px;color:#e9dcc0;font:inherit;cursor:pointer;transition:.2s}
.msave.hc{border-left-color:#e0483a}
.msave:hover{background:#2a1c10dd;border-color:#ffb85c}
.msave b{display:block;font-size:14px;letter-spacing:.1em}.msave span{font-size:12px;opacity:.75}.msave i{margin-left:auto;font-style:normal;color:#ffb85c;font-size:16px}
.mfoot{margin-top:18px;font-size:11px;letter-spacing:.14em;color:#8f8267;text-align:center;line-height:1.7}
.mttl{font:400 clamp(24px,5.4vw,42px)/1 var(--ft);letter-spacing:.2em;padding-left:.2em;text-align:center;color:#f0dcae;text-shadow:0 0 22px #ff8a2a55,0 2px 0 #2a0e04;margin:0 0 clamp(14px,3vh,26px)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(94vw,840px)}
.card{text-align:left;position:relative;padding:18px 18px 16px;background:linear-gradient(#1d1812e0,#0e0b08ee);border:1px solid #6b523099;border-radius:5px;cursor:pointer;color:inherit;font:inherit;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px)}
.card.sel{border-color:#ffb85c;box-shadow:0 0 0 1px #ffb85c77,0 0 36px #ff8a2a40}
.card.hc.sel{border-color:#ff5a4a;box-shadow:0 0 0 1px #ff5a4a77,0 0 36px #e0281850}
.card .ic{font-size:34px;line-height:1;margin-bottom:8px;filter:drop-shadow(0 0 10px #ff8a2a66)}
.card h3{margin:0 0 4px;font:400 24px/1.1 var(--ft);letter-spacing:.18em}
.card .sub{font-size:12px;letter-spacing:.08em;color:#c8b58c;margin-bottom:10px}
.card ul{margin:0;padding-left:17px;font-size:13px;line-height:1.55;color:#d6c9aa}
.card li::marker{color:#e0903a}.card.hc li::marker{color:#e0483a}
.card .tag{position:absolute;right:12px;top:12px;font-size:11px;letter-spacing:.1em;padding:3px 8px;border-radius:20px;background:#e0903a22;border:1px solid #e0903a88;color:#ffd08a}
.card.hc .tag{background:#e0483a22;border-color:#e0483a99;color:#ffb0a6}
.card .chk{position:absolute;right:12px;bottom:12px;width:20px;height:20px;border-radius:50%;border:1px solid #8a6a3a;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.25s}
.card.sel .chk{background:#ffb85c;border-color:#ffb85c;color:#2a1405}.card.hc.sel .chk{background:#ff5a4a;border-color:#ff5a4a;color:#2a0505}
.mnote{margin:14px 0 16px;font-size:12px;letter-spacing:.06em;color:#b3a27c;text-align:center;max-width:620px;line-height:1.5}
.mrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start}
.mrow .mb{margin:0}
#mdl{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;padding:18px;background:#000c;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
#mdl.on{opacity:1;visibility:visible;transition:opacity .3s}
#mdl .box{width:min(94vw,470px);max-height:92vh;overflow:auto;text-align:center;padding:24px 22px 18px;background:linear-gradient(#211a12,#0f0b08);border:1px solid #8a6a3a;border-radius:6px;box-shadow:0 20px 70px #000,0 0 50px #ff8a2a22;transform:scale(.94);transition:transform .3s}
#mdl.on .box{transform:none}
#mdl.dng .box{border-color:#c4382c;box-shadow:0 20px 70px #000,0 0 60px #e0281840}
#mdl .mi2{font-size:40px;margin-bottom:6px}
#mdl p{margin:0 0 18px;font-size:16px;line-height:1.55;color:#eadfc4}
#mdl.dng p b{color:#ff8a7a}
#mdl .mb{width:100%;margin-bottom:10px}
/* экран смерти */
#dead{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:9;text-align:center;font-family:var(--ff);background:radial-gradient(ellipse at 50% 45%,#3a0a0acc 0%,#0a0202f2 75%);animation:deadIn 1.2s both;overflow:auto}
#dead.hc{background:radial-gradient(ellipse at 50% 45%,#1a1a1ecc 0%,#030304f5 78%)}
#dead .sk{font-size:clamp(46px,9vw,72px);filter:drop-shadow(0 0 22px #e03020aa);animation:fadeUp 1.2s .3s both}
#dead h1{margin:8px 0 8px;font:400 clamp(30px,7.5vw,64px)/1.05 var(--ft);letter-spacing:.14em;padding-left:.14em;color:#d8372a;text-shadow:0 0 30px #a01810,0 3px 0 #200;animation:fadeUp 1.2s .5s both}
#dead.hc h1{color:#cfc9bd;text-shadow:0 0 26px #000,0 3px 0 #000}
#dead .ds{max-width:520px;font-size:clamp(14px,3.6vw,17px);line-height:1.6;color:#dccfb2;margin:0 0 22px;animation:fadeUp 1.2s .8s both}
#dead .ds .st{display:flex;justify-content:space-between;gap:20px;padding:7px 2px;border-bottom:1px solid #ffffff1c;font-size:15px}
#dead .ds .st b{color:#ffd08a}
#dead .mb{animation:fadeUp 1.2s 1.1s both}
@keyframes deadIn{from{opacity:0}to{opacity:1}}
@keyframes logoIn{0%{opacity:0;letter-spacing:.3em;filter:blur(14px) drop-shadow(0 0 0 #000)}100%{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flick{0%,100%{filter:drop-shadow(0 3px 0 #2a0e04) drop-shadow(0 0 24px #ff8a2a55)}45%{filter:drop-shadow(0 3px 0 #2a0e04) drop-shadow(0 0 34px #ff8a2a88)}70%{filter:drop-shadow(0 3px 0 #2a0e04) drop-shadow(0 0 20px #ff8a2a44)}}
@media (min-aspect-ratio:13/10) and (min-width:820px){#s-main .mi{align-items:flex-start;padding-left:7vw;margin-left:0;width:auto}#s-main .logo{text-align:left}#s-main .logo h2{justify-content:flex-start;padding-left:.2em}#s-main .logo h2::before{display:none}#s-main .mnav,#s-main .msv,#s-main .mfoot{align-self:flex-start}#s-main .mb{margin-left:0}#s-main .mfoot{text-align:left}}
@media (max-aspect-ratio:1/1){#s-main{padding-bottom:24vh}}
@media (max-height:520px){.logo{margin-bottom:10px}.logo h1{font-size:clamp(34px,9vh,60px)}.logo h2{font-size:14px;margin-top:.3em}.mb{padding:11px 18px;margin-bottom:8px}.mfoot{display:none}.card{padding:12px 14px}.card .ic{font-size:24px}.card ul{font-size:12px}.mttl{margin-bottom:8px}}
@media (max-width:620px){.cards{grid-template-columns:1fr;gap:10px}.card{padding:14px}.card ul{font-size:12px}.card .ic{display:inline-block;margin:0 8px 0 0;font-size:26px;vertical-align:middle}.card h3{display:inline-block;vertical-align:middle;font-size:20px}}
/* игровые добавки: кнопки сверху, значок режима, карта */
#top2{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 48px);display:flex;gap:6px}
#top2 button{width:38px;height:38px;border-radius:50%;border:2px solid #fff5;background:#14202bcc;color:#fff;font-size:18px;touch-action:none}
#mbd{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.08em;background:#0008;border-radius:8px;padding:3px 8px}
#mbd.hc{color:#ff9a8a;border:1px solid #e0483a88}#mbd.sv{color:#ffd08a;border:1px solid #e0903a66}
#mapc{position:static;inset:auto;height:auto;width:min(100%,calc(100vh - 290px));min-width:170px;aspect-ratio:1;display:block;margin:6px auto 8px;border:2px solid #3b5a73;border-radius:10px;background:#0b2a3a}
#mapi{font-size:12px;line-height:1.6;text-align:center;opacity:.9}
#pm .mb{margin-left:auto;margin-right:auto}#pm .ib{font-size:13px;margin-bottom:12px}
#mdep{display:inline-block;margin:6px 0 0 4px;font-size:11px;font-weight:700;letter-spacing:.06em;background:#0008;border:1px solid #8cf6;color:#bfe3ff;border-radius:8px;padding:3px 8px}

/* --- Креатив / панель предметов --- */
.cards{grid-template-columns:repeat(3,1fr);width:min(96vw,1040px)}
@media (max-width:860px){.cards{grid-template-columns:1fr;gap:10px}}
.card.cr.sel{border-color:#5ec8ff;box-shadow:0 0 0 1px #5ec8ff77,0 0 36px #1e9be040}
.card.cr li::marker{color:#4fb0e0}
.card.cr .tag{background:#3aa0e022;border-color:#3aa0e099;color:#a8e0ff}
.card.cr.sel .chk{background:#5ec8ff;border-color:#5ec8ff;color:#05202e}
.card.cr .ic{filter:drop-shadow(0 0 10px #3aa0e088)}
.card .cdesc{margin:0 0 8px;font-size:13px;line-height:1.5;color:#e2d6b8}
.msave.cr{border-left-color:#4fb0e0}
#mbd.cr{color:#9fe0ff;border:1px solid #3aa0e088}
#cp{width:min(96vw,560px)}
#cpc{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;padding-right:28px}
#cpc button{flex:1 1 auto;min-height:40px;padding:6px 10px;background:#1c2b38;color:#fff;border:1px solid #456;border-radius:8px;font-size:13px}
#cpc button.on{background:#2c5a7a;border-color:#5ec8ff}
.cps{display:flex;align-items:center;gap:10px;margin-bottom:8px}.cps i{font-style:normal;font-size:34px}.cps small{display:block;opacity:.7;font-size:12px}
.cpn{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cpn button{flex:1;min-width:0;padding:0;min-height:42px;background:#2c5a7a;color:#fff;border:0;border-radius:8px;font-size:14px}
.cpn b{min-width:52px;text-align:center;font-size:18px}
.cpp button{background:#3a4a58}
.cpgo{width:100%;min-height:50px;margin-bottom:12px;background:#2c7a3e;color:#fff;border:0;border-radius:10px;font-size:16px;font-weight:700}
.cpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.cpi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;padding:6px 4px;background:#1c2b38;color:#fff;border:2px solid #456;border-radius:10px}
